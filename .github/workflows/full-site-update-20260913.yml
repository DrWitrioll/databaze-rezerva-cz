name: Full website canon update 2026-09-13
on:
  push:
    branches: [full-update-20260913]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build updated production HTML
        run: python scripts/update_full_site_20260913.py
      - name: Verify output
        run: |
          test -s site-full-update-20260913.html
          grep -q 'revize kánonu: 13. 9. 2026' site-full-update-20260913.html
          grep -q 'Rasy a služební značení A7' site-full-update-20260913.html
          grep -q 'Kalendář Protos Singulár — 24 měsíců' site-full-update-20260913.html
          ! grep -q 'Tříhlavý drak' site-full-update-20260913.html
          wc -c site-full-update-20260913.html
      - name: Commit generated HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site-full-update-20260913.html
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m "Generate full website update 2026-09-13"
          git push
