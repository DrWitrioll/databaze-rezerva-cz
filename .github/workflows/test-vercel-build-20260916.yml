name: Test Vercel build 2026-09-16
on:
  push:
    branches: [press-gallery-20260916-v2]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run production build chain
        run: |
          python3 scripts/update_full_site_20260913.py
          python3 scripts/add_three_images_20260913.py
          python3 scripts/mark_owen_dead_20260913.py
          python3 scripts/add_vampirus_article_20260913.py
          python3 scripts/update_current_canon_20260916.py
          python3 scripts/add_press_gallery_20260916.py
      - name: Validate markers
        run: |
          test -f dist/index.html
          grep -q 'article-galactic-map' dist/index.html
          grep -q 'article-custodes-med' dist/index.html
          grep -q 'article-diplomacy-third' dist/index.html
          grep -q 'article-protos-singular' dist/index.html
          grep -q 'data-tab="pressgallery"' dist/index.html
          test -s dist/assets/galactic-map-oskn-helios.png
          test -s dist/assets/custodes-med-b4.png
          echo BUILD_VALIDATED
