name: Remove dragon card
on:
  push:
    branches: [image-deploy-20260912]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download current production HTML and remove only dragon card
        run: |
          python - <<'PY'
          import urllib.request,re
          url='https://res.cloudinary.com/emmgrwto/raw/upload/rezervni-posadka/site-final.html'
          html=urllib.request.urlopen(url).read().decode('utf-8')
          pattern=r'<article class="card full hero-card">(?:(?!</article>).)*?<h3>Tříhlavý drak</h3>(?:(?!</article>).)*?</article>\s*'
          new,n=re.subn(pattern,'',html,count=1,flags=re.S)
          if n!=1:
              raise SystemExit(f'Expected exactly 1 dragon card, removed {n}')
          if 'BESTIÁŘ // TŘÍHLAVÝ DRAK' in new or '<h3>Tříhlavý drak</h3>' in new:
              raise SystemExit('Dragon card still present')
          open('site-final-no-dragon.html','w',encoding='utf-8').write(new)
          print('original',len(html),'new',len(new),'removed',len(html)-len(new))
          PY
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site-final-no-dragon.html
          git commit -m "Remove three-headed dragon card from production HTML" || exit 0
          git push
