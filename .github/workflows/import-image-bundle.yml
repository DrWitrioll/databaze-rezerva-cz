name: Import image bundle
on:
  push:
    branches: [image-deploy-20260912]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download bundle from temporary share
        run: |
          python - <<'PY'
          import urllib.request, json
          api='https://api.firestorage.ai/prod/file'
          share='oTsZjHIz281D'
          with urllib.request.urlopen(f'{api}/shares/{share}/files?maxResults=1000') as r:
              listing=json.loads(r.read().decode('utf-8'))
          files=listing.get('files') or []
          if not files: raise SystemExit('No files in share')
          f=files[0]
          endpoint=f"{api}/shares/{share}/files/{f['fileId']}/download"
          req=urllib.request.Request(endpoint, method='POST')
          with urllib.request.urlopen(req) as r:
              obj=json.loads(r.read().decode('utf-8'))
          with urllib.request.urlopen(obj['downloadUrl']) as r:
              body=r.read()
          open('/tmp/bundle.zip','wb').write(body)
          print('ZIP_BYTES',len(body))
          PY
      - name: Unpack deployment files
        run: |
          rm -rf deploy
          mkdir -p deploy
          unzip -q /tmp/bundle.zip -d deploy
          test -f deploy/site-final-with-images.html
          test -f deploy/web-assets/posadka-nii-velka.png
          test -f deploy/web-assets/havel-sektor-b3.png
          test -f deploy/web-assets/heliorske-sestry.png
          test -f deploy/web-assets/kaelith-portret.png
          test -f deploy/web-assets/kredity-nominaly.png
          test -f deploy/web-assets/kredit-detail.png
          test -f deploy/web-assets/stanicni-osobnost.png
      - name: Commit bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy
          git commit -m "Stage Rezervni posadka image bundle" || exit 0
          git push
