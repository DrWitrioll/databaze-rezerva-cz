name: Import personnel canon fix
on:
  push:
    branches: [canon-sync-20260912]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download exact HTML from temporary share
        run: |
          python - <<'PY'
          import urllib.request, json
          api='https://api.firestorage.ai/prod/file'
          share='mitjnhQ-Mhv3'
          with urllib.request.urlopen(f'{api}/shares/{share}/files?maxResults=1000') as r:
              listing=json.loads(r.read().decode('utf-8'))
          f=(listing.get('files') or [])[0]
          endpoint=f"{api}/shares/{share}/files/{f['fileId']}/download"
          req=urllib.request.Request(endpoint, method='POST')
          with urllib.request.urlopen(req) as r:
              obj=json.loads(r.read().decode('utf-8'))
          with urllib.request.urlopen(obj['downloadUrl']) as r:
              body=r.read()
          text=body.decode('utf-8')
          required=['stav osazenstva: 232 evidovaných / 230 fyzických','50 kočko-lidí','50 pso-lidí','60 trpaslíků','50 ještěřanů','26. 3. 2188 — další evakuace']
          for s in required:
              assert s in text, 'Missing: '+s
          open('site-final.html','wb').write(body)
          print('HTML_BYTES',len(body))
          PY
      - name: Commit corrected production source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site-final.html
          git commit -m "Restore multiracial NII personnel canon" || exit 0
          git push
