name: Import Ursane image
on:
  push:
    branches: [image-deploy-20260912]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Ursane image from temporary share
        run: |
          python - <<'PY'
          import urllib.request, json, os
          api='https://api.firestorage.ai/prod/file'
          share='sWGnDq9aX2L8'
          with urllib.request.urlopen(f'{api}/shares/{share}/files?maxResults=100') as r:
              listing=json.loads(r.read().decode('utf-8'))
          files=listing.get('files') or []
          if not files:
              raise SystemExit('No shared files')
          f=files[0]
          endpoint=f"{api}/shares/{share}/files/{f['fileId']}/download"
          req=urllib.request.Request(endpoint, method='POST')
          with urllib.request.urlopen(req) as r:
              obj=json.loads(r.read().decode('utf-8'))
          u=obj['downloadUrl']
          with urllib.request.urlopen(u) as r:
              body=r.read()
          os.makedirs('deploy/new-web-images', exist_ok=True)
          open('deploy/new-web-images/ursane.png','wb').write(body)
          print('URSANE_BYTES', len(body))
          PY
      - name: Commit Ursane image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/new-web-images/ursane.png
          git commit -m "Stage Ursane image" || exit 0
          git push
